name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (no API keys)
        run: ruff check spectrace tests scripts
      - name: Test (no API keys)
        run: pytest
        env:
          # Guard against accidental paid-provider use in CI.
          SPECTRACE_BASE_URL: ""
          SPECTRACE_API_KEY: ""
          TYPESAFE_API_KEY: ""
          TYPESAFE_KEY: ""
      - name: Demo smoke (offline, $0)
        run: |
          spectrace demo --output "$RUNNER_TEMP/demo/index.html"
          spectrace demo --from-report docs/live-jev-grade-15traces-20261010.json --output "$RUNNER_TEMP/demo-live/index.html"
          test -s "$RUNNER_TEMP/demo/index.html"
          test -s "$RUNNER_TEMP/demo-live/index.html"
        env:
          SPECTRACE_BASE_URL: ""
          SPECTRACE_API_KEY: ""
          TYPESAFE_API_KEY: ""
          TYPESAFE_KEY: ""
